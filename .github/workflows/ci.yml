name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
      - name: Ruff
        run: |
          ruff check src tests scripts configs
          ruff format --check src tests scripts configs
      - name: Compile
        run: python -m compileall -q src scripts tests configs
      - name: Type-check new infrastructure
        run: mypy src/weld_data_workbench/provenance.py src/weld_data_workbench/splits.py
      - name: Tests
        run: pytest -q --cov=weld_data_workbench --cov-report=term-missing --cov-report=xml
      - name: Synthetic end-to-end smoke
        run: make synthetic-smoke
      - name: Build wheel
        run: python -m build --wheel
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  wheel-smoke:
    name: Clean wheel smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install wheel and smoke CLI
        run: |
          python -m venv /tmp/weld-wheel-venv
          /tmp/weld-wheel-venv/bin/pip install dist/*.whl
          /tmp/weld-wheel-venv/bin/weldtool --help
          /tmp/weld-wheel-venv/bin/weldtool synthetic --output /tmp/weld-synthetic
